name: build-and-deploy

# 定期実行（1日3回・JST 6/13/21時 = UTC 21/4/12時）＋手動＋main push
on:
  schedule:
    - cron: "0 21,4,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      health: ${{ steps.build.outputs.health }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 読み取りの部品の検査（落ちたら配信しない＝前回の正常な配信が残る）
      - run: python test_paypay_dome.py
      - run: python test_marine_messe.py
      - run: python test_feed_watch.py
      - run: python test_fukuoka_budokan.py
      - id: build
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 配った後で、取り込み口の失敗・消えた会場があれば赤にする（GitHub が持ち主へメール）。
      # 2026-10-16 マリンメッセ4会場が黙って0件になっていた件の再発防止。
      - name: 要対応を赤にする
        if: needs.build.outputs.health == 'failure'
        run: |
          echo "::error::イベントの配信に要対応があります。build ジョブの『build.py』の [要対応] と、公開中の health.json を見てください（配信は済んでいます）"
          exit 1
